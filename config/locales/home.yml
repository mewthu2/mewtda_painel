        title: "WhatsApp (Z-API)"
        text: "Tracking, cashback, and cart recovery automations."
      google_ads:
        title: "Google Ads"
        text: "Ad spend feeding straight into your ROAS and CAC calculations."
      meta_ads:
        title: "Meta Ads"
        text: "Facebook and Instagram spend in the same panel."
