    qt_page:
      meta_title: Pode Trocar — cambios y devoluciones
      nav:
        como: Cómo funciona
        painel: Panel
        beneficios: Beneficios
        faq: Dudas
      hero:
        eyebrow: CAMBIOS Y DEVOLUCIONES
        headline_a: Tu cliente abre el cambio.
        headline_b: Tú solo apruebas.
        sub: 'Pode Trocar le da a tu tienda un portal de cambios self-service: el cliente busca su pedido, elige los ítems y envía el motivo. Al aprobar, el vale se convierte en cupón de Shopify — sin planillas ni hilos de e-mail.'
        cta: Lo quiero en mi tienda
        cta_secondary: Ver cómo funciona
        whatsapp_message: Hola, quiero conocer Pode Trocar para mi tienda.
      steps:
        eyebrow: CÓMO FUNCIONA
        title: De la solicitud al cupón, sin perseguir a nadie
        lead: Cuatro pasos desde que el cliente quiere cambiar hasta que el vale llega a su e-mail.
        items:
          pedido:
            title: El cliente abre el cambio
            text: En una página propia de tu tienda, busca el pedido por número y e-mail y elige los ítems — sin escribirle a tu equipo.
          regras:
            title: Las reglas evalúan
            text: El plazo y las condiciones de cada pedido se revisan automáticamente. ¿Producto con daño? El motivo y la foto entran junto con la solicitud.
          vale:
            title: Aprobado, se vuelve vale
            text: Apruebas en el panel y el cupón se crea directo en Shopify. El cliente lo recibe por e-mail al instante.
          acompanha:
            title: Tu equipo lo ve todo
            text: Cada solicitud con estado claro en el panel — pendiente, aprobada, recibida, concluida — y el cliente avisado por e-mail en cada etapa.
      painel:
        eyebrow: EL PANEL
        title: Todas las solicitudes en un solo lugar
        lead: Busca por pedido, protocolo, nombre o e-mail y mira en qué punto está cada cambio y devolución — desde el computador o el celular.
      benefits:
        eyebrow: LO QUE CAMBIA
        title: Menos fricción para todos
        items:
          equipe:
            title: Tu equipo, fuera del e-mail
            text: Se acabó negociar cambios uno a uno por planilla o WhatsApp. Toda la fila vive en el panel, con estados claros.
          cliente:
            title: Mejor experiencia para el cliente
            text: Quien cambia lo resuelve al instante, solo, en una página con la cara de tu tienda — y conoce el estado sin tener que preguntar.
          caixa:
            title: La venta se queda en tu tienda
            text: 'Un cambio aprobado se convierte en cupón de Shopify: el valor vuelve como nueva compra, no como reembolso.'
          shopify:
            title: Conectado a Shopify
            text: El portal lee directo de los pedidos de tu tienda. Nada de digitar datos a mano ni revisar pedido por pedido.
      faq:
        eyebrow: DUDAS
        title: Preguntas frecuentes sobre Pode Trocar
        items:
        - q: ¿Necesito una tienda en Shopify?
          a: Sí — Pode Trocar se conecta directo a los pedidos de tu tienda Shopify. Si todavía no tienes tienda, también la creamos desde cero, ya con el sistema de cambios conectado.
        - q: ¿Quién define las reglas de cambio?
          a: Tú. Los plazos y condiciones se configuran en el panel, y el sistema los aplica a cada pedido automáticamente — incluso exigiendo motivo y foto cuando el producto llega con daño.
        - q: ¿Y si el cliente quiere su dinero de vuelta?
          a: Las devoluciones también entran por el portal y caen en el mismo panel. El vale automático es para los cambios; el reembolso lo procesas tú con tu medio de pago — con la solicitud organizada y el cliente avisado por e-mail.
        - q: ¿Mi cliente necesita crear una cuenta?
          a: No. Busca el pedido por el número y el e-mail de la compra. Sin contraseña y sin registro.
        - q: ¿Cómo lo contrato?
          a: Escríbenos por WhatsApp. Entendemos tu operación, conectamos Pode Trocar a tu Shopify y dejamos la página de cambios con la cara de tu tienda.
      cta:
        title: ¿Sacamos los cambios de tu e-mail?
        text: Mándanos un mensaje por WhatsApp y te mostramos el sistema por dentro.
        button: Hablar con Mewtda
        whatsapp_message: Hola, quiero sumar Pode Trocar a mi tienda Shopify.
