      eyebrow: "WE BUILD YOUR STORE"
      title: "Don't have a store yet? We'll build it for you"
      lead: "Besides the CRM, we also build your Shopify store from scratch — design that looks like your brand, already integrated with Mewtda from day one, no setup headaches."
      design:
        title: "Custom design"
        text: "A layout built for your brand and your product, not a generic template."
      loja:
        title: "Complete Shopify store"
        text: "Products, payments, shipping, and domain, fully configured end to end."
      crm:
        title: "Already integrated with the CRM"
        text: "No extra work later — your store launches already connected to the Mewtda panel."
