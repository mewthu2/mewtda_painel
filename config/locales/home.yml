        title: "Sales Dashboard"
        items:
          - "Real-time revenue, ROAS, and CAC"
          - "Monthly goals with progress bar"
          - "Daily sales and conversion charts"
          - "Google Ads vs. Meta Ads comparison"
          - "Spreadsheet report exports"
