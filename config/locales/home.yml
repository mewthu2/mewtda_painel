      title: "From first login to results, in three steps"
      step1:
        title: "Connect your store"
        text: "Authorize access to your Shopify in a few clicks — no installs, no developer needed."
      step2:
        title: "Set up your automations"
        text: "Define messages, deadlines, and coupons for your WhatsApp automations and monthly goals."
      step3:
        title: "Track your results"
        text: "Dashboards update automatically, with a daily history of sales and conversion."
