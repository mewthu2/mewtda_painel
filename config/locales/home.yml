    crm_page:
      meta_title: MeuCRM — E-commerce CRM
      nav:
        recursos: Features
        automacoes: Automations
        painel: Panel
        faq: FAQ
      hero:
        eyebrow: E-COMMERCE CRM
        headline_a: Customers, sales and funnel.
        headline_b: All in one panel.
        sub: 'MeuCRM connects your Shopify, your ads and your WhatsApp in a single panel: see the whole funnel, know every customer, and know exactly where you''re losing sales.'
        cta: Show me the CRM
        cta_secondary: See the features
        whatsapp_message: Hi! I'd like to see MeuCRM for my store.
      features:
        eyebrow: FEATURES
        title: Everything your operation needs, no hunting for numbers
        lead: What lives in scattered spreadsheets and tools today moves into one panel — updated straight from your store.
        items:
          funil:
            title: Sales dashboard
            text: 'Revenue, ROAS and CAC day by day, plus the full funnel: visits, product views, carts and checkouts.'
          clientes:
            title: Customer base
            text: Every customer's purchase history, segmented and ready for campaigns — no exports needed.
          metas:
            title: Monthly goals
            text: Set the month's goal and follow it with your team, right where the sales are coming in.
          trocas_int:
            title: Integrated exchanges
            text: 'Pode Trocar lives right here: requests, approvals and store credit without leaving the panel.'
          afiliados:
            title: Affiliates and coupons
            text: Create coupons and manage your affiliates in the same place your sales show up.
          integracoes:
            title: Integrations
            text: 'Shopify, Google Ads and Meta Ads connected: sales and ad spend side by side, no manual reports.'
      autos:
        eyebrow: WHATSAPP AUTOMATIONS
        title: Messages that send themselves, right on time
        lead: Tracking updates, cashback and cart reminders land on your customer's WhatsApp — no one on the team copying and pasting.
        chat:
        - from: loja
          text: 'Good news! Order #1042 is out for delivery. Track it here: BR123456789BR'
        - from: cliente
          text: Wow, that was fast! Thanks!
        - from: loja
          text: Did everything arrive okay? Your cashback from this order is ready to use on your next one.
        - from: cliente
          text: It did! Already eyeing my next order.
        items:
          rastreio:
            title: Automatic tracking
            text: 'Order ships, customer knows: the tracking code lands on WhatsApp with zero manual work.'
          cashback:
            title: Cashback unlocked
            text: Customers hear the moment their cashback is ready — a real reason to come back and buy again.
          carrinho:
            title: Abandoned cart
            text: Anyone who stopped at checkout gets a reminder at the right moment, straight from the panel.
      painel:
        eyebrow: THE PANEL
        title: Built to open every day
        lead: 'One look and you know how the store is doing: sales, funnel, goals and customers on one screen, updated straight from your Shopify.'
      faq:
        eyebrow: FAQ
        title: The most common questions about MeuCRM
        items:
        - q: Does it work with my Shopify store?
          a: Yes. MeuCRM connects to your Shopify and brings orders, customers and the funnel into the panel. And if you don't have a store yet, we also build one from scratch, already connected.
        - q: My operation runs on spreadsheets today. Is migrating painful?
          a: No — you don't type in any data by hand. Connect your Shopify and the panel starts tracking your orders and customers, while the spreadsheet slowly retires.
        - q: Who is MeuCRM for?
          a: Owners and teams of Shopify stores who handle sales, ads and customer care every day and want to see the whole operation without opening ten tabs.
        - q: Do the automations use the official WhatsApp API?
          a: Tracking, cashback and cart automations go out through the WhatsApp connected to your panel. Our team sets it up with you during onboarding and recommends the right setup for your message volume.
        - q: How do I get started?
          a: 'No forms: message us on WhatsApp, tell us how your operation runs today and we''ll show you the panel in action. Next steps are agreed in that conversation.'
      cta:
        title: Ready to run your store from one panel?
        text: Message us on WhatsApp and tell us how your operation runs today — we'll show you MeuCRM working.
        button: Talk to Mewtda
        whatsapp_message: Hi! I'd like to see MeuCRM for my store.
    qt_page:
      meta_title: Pode Trocar — exchanges & returns
      nav:
        como: How it works
        painel: Panel
        beneficios: Benefits
        faq: FAQ
      hero:
        eyebrow: EXCHANGES & RETURNS
        headline_a: Your customer opens the exchange.
        headline_b: You just approve it.
        sub: 'Pode Trocar gives your store a self-service exchange portal: customers find their order, pick the items and send the reason. Once approved, the store credit becomes a Shopify coupon — no spreadsheets, no email threads.'
        cta: Get it for my store
        cta_secondary: See how it works
        whatsapp_message: Hi! I'd like to see Pode Trocar for my store.
      steps:
        eyebrow: HOW IT WORKS
        title: From request to coupon, with no one chasing anyone
        lead: Four steps between a customer wanting an exchange and the store credit landing in their inbox.
        items:
          pedido:
            title: The customer opens the exchange
            text: On your store's own exchange page, they find the order by number and email and pick the items — without messaging your team.
          regras:
            title: The rules do the checking
            text: Each order's window and conditions are checked automatically. Product arrived damaged? Reason and photo go in with the request.
          vale:
            title: Approved means store credit
            text: You approve it in the panel and the coupon is created right in Shopify. The customer gets it by email instantly.
          acompanha:
            title: Your team sees everything
            text: Every request has a clear status in the panel — pending, approved, received, completed — and the customer is emailed at each step.
      painel:
        eyebrow: THE PANEL
        title: Every request in one place
        lead: Search by order, protocol, name or email and see where each exchange and return stands — from your desktop or your phone.
      benefits:
        eyebrow: WHAT CHANGES
        title: Less friction for everyone
        items:
          equipe:
            title: Your team, out of the inbox
            text: No more negotiating exchanges one by one over email or spreadsheets. The whole queue lives in the panel, with clear statuses.
          cliente:
            title: A better experience for customers
            text: Whoever needs an exchange solves it on the spot, on a page that looks like your store — and knows the status without having to ask.
          caixa:
            title: The sale stays in your store
            text: 'An approved exchange becomes a Shopify coupon: the value comes back to your store as a new purchase, not as a refund.'
          shopify:
            title: Connected to Shopify
            text: The portal reads straight from your store's orders. No typing data by hand, no checking order by order.
      faq:
        eyebrow: FAQ
        title: Common questions about Pode Trocar
        items:
        - q: Do I need a Shopify store?
          a: Yes — Pode Trocar connects directly to your Shopify orders. If you don't have a store yet, we can also build one from scratch, with the exchange system already wired in.
        - q: Who sets the exchange rules?
          a: You do. Windows and conditions live in the panel settings, and the system applies them to every order automatically — including requiring a reason and photo when a product arrives damaged.
        - q: What if the customer wants their money back?
          a: Returns come in through the portal too and land in the same panel. The automatic store credit is for exchanges; you process the refund itself through your payment provider — with the request organized and the customer kept posted by email.
        - q: Do customers need an account?
          a: No. They find the order by its number and the purchase email. No password, no sign-up.
        - q: How do I get it?
          a: Message us on WhatsApp. We'll look at how you operate, connect Pode Trocar to your Shopify and style the exchange page to match your store.
      cta:
        title: Ready to get exchanges out of your inbox?
        text: Send us a message on WhatsApp and we'll show you the system from the inside.
        button: Talk to Mewtda
        whatsapp_message: Hi! I'd like Pode Trocar for my Shopify store.
