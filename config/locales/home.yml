          a: "Funil de conversão (visitas, produtos vistos, carrinhos e checkouts), histórico de clientes, metas mensais, faturamento, ROAS e CAC, além das automações de WhatsApp."
        - q: "Como funciona o Pode Trocar?"
          a: "Seu cliente busca o pedido pelo número e e-mail, escolhe os itens e envia o motivo. Você aprova no painel e o vale-troca vira cupom na Shopify, enviado por e-mail."
        - q: "A loja criada pela Mewtda já vem pronta?"
          a: "Sim: design sob medida, produtos, pagamentos, frete e domínio configurados, e a loja entra no ar já conectada ao painel Mewtda."
        - q: "Quando o app da minha loja fica pronto?"
          a: "O app para iOS e Android está em desenvolvimento. Fale com a gente no WhatsApp para ser avisado no lançamento."
        - q: "Como eu começo?"
          a: "Chame a gente no WhatsApp, conte como está sua operação e mostramos quais soluções fazem sentido para o seu momento."
